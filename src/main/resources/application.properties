# =====================================================
# APPLICATION
# =====================================================

spring.application.name=resource-booking-system

server.port=8080


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/resource_booking_db?createDatabaseIfNotExist=true

# Database credentials should be provided via environment variables in production.
# Example (Linux/macOS): export DB_USERNAME=myuser && export DB_PASSWORD=mypassword
# Do NOT commit production credentials to version control.
spring.datasource.username=root

spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =====================================================
# JWT
# =====================================================

## JWT secret must be provided via the environment variable JWT_SECRET in production.
## A default is provided here for local development and to prevent out-of-the-box startup failures.
app.jwt.secret=${JWT_SECRET:my_super_secret_key_which_is_at_least_32_bytes_long_12345}

# TTL in milliseconds
app.jwt.expiration=86400000


# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html