# =====================================================
# APPLICATION
# =====================================================

spring.application.name=resource-booking-system

server.port=8080


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/resource_booking_db

# Database credentials should be provided via environment variables in production.
# Example (Linux/macOS): export DB_USERNAME=myuser && export DB_PASSWORD=mypassword
# Do NOT commit production credentials to version control.
spring.datasource.username=${DB_USERNAME:}

spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =====================================================
# JWT
# =====================================================

## JWT secret must be provided via the environment variable JWT_SECRET in production.
## No default is provided here to avoid committing secrets. For local development and
## tests, set `JWT_SECRET` in your environment or use the test profile properties.
app.jwt.secret=${JWT_SECRET}

# TTL in milliseconds
app.jwt.expiration=86400000


# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html