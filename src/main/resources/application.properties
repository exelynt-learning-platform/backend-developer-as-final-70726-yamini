# =====================================================
# APPLICATION
# =====================================================

spring.application.name=resource-booking-system

server.port=8080


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/resource_booking_db

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =====================================================
# JWT
# =====================================================

## Development default JWT secret. ONLY for local development and tests.
## In production, set the environment variable JWT_SECRET to a secure value.
app.jwt.secret=${JWT_SECRET:test-jwt-secret-that-is-long-enough-for-tests-00001}

# TTL in milliseconds
app.jwt.expiration=86400000

# Allow generating a runtime temporary JWT secret when no secret is configured.
# Default false for production safety. Set to true only for local development/tests.
app.jwt.allow-runtime-fallback=false


# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html