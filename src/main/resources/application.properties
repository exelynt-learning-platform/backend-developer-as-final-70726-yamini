# =====================================================
# APPLICATION
# =====================================================

spring.application.name=resource-booking-system

server.port=8080


# =====================================================
# MYSQL DATABASE
# =====================================================

spring.datasource.url=jdbc:mysql://localhost:3306/resource_booking_db?

spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# =====================================================
# JWT
# =====================================================

# Local development secret - must be at least 32 bytes
app.jwt.secret=my_super_secret_key_for_resource_booking_system_2026

# Token expiration: 24 hours
app.jwt.expiration=86400000


# =====================================================
# SWAGGER / OPENAPI
# =====================================================

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html