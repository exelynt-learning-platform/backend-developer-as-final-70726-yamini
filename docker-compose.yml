version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: rbs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: resource_booking_db
      MYSQL_USER: rbs_user
      MYSQL_PASSWORD: rbs_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
